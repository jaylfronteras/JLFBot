name: ${COMPOSE_PROJECT_NAME:-jlfbot}
services:
  jlfbot:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${JLFBOT_BASE_IMAGE:-ghcr.io/jaylfronteras/jlfbot:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${JLFBOT_LOCAL_IMAGE:-jlfbot-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${JLFBOT_BIND_ADDRESS:-127.0.0.1}:${JLFBOT_HTTP_PORT:-8080}:80"
    environment:
      JLFBOT_PORT: "8799"
      JLFBOT_WEBHOOK_PORT: "8800"
      JLFBOT_PUBLIC_URL: ${JLFBOT_PUBLIC_URL:-http://localhost:${JLFBOT_HTTP_PORT:-8080}}
      JLFBOT_WEBHOOK_PUBLIC_URL: ${JLFBOT_WEBHOOK_PUBLIC_URL:-${JLFBOT_PUBLIC_URL:-http://localhost:${JLFBOT_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('jlfbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:jlfbot
    environment:
      JLFBOT_HTTPS_HOST: ${JLFBOT_HTTPS_HOST:-}
      JLFBOT_BIND_ADDRESS: ${JLFBOT_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export JLFBOT_UPSTREAM_SCHEME=http
        if [ -n "$$JLFBOT_HTTPS_HOST" ] && [ "$$JLFBOT_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "JLFBOT_HTTPS_HOST requires JLFBOT_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$JLFBOT_HTTPS_HOST" ]; then
          export JLFBOT_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      jlfbot:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${JLFBOT_DATA_EXTERNAL:-false}
    name: ${JLFBOT_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-jlfbot}_data}
  caddy_data:
  caddy_config:
