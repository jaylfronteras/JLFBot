name: ${COMPOSE_PROJECT_NAME:-jlfbot-podman}
services:
  jlfbot:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/jlfbot-podman:${JLFBOT_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${JLFBOT_DATA_ROOT:?Run setup.sh first}:${JLFBOT_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/jlfbot-podman.sock
    environment:
      HOME: ${JLFBOT_DATA_ROOT}
      JLFBOT_DATA_DIR: ${JLFBOT_DATA_ROOT}/.jlfbot
      JLFBOT_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/jlfbot-podman.sock
      JLFBOT_PORT: ${JLFBOT_PORT:-8799}
      JLFBOT_WEBHOOK_PORT: ${JLFBOT_WEBHOOK_PORT:-8800}
      JLFBOT_PUBLIC_URL: ${JLFBOT_PUBLIC_URL:-http://localhost:8080}
      JLFBOT_WEBHOOK_PUBLIC_URL: ${JLFBOT_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$JLFBOT_PORT/api/health | grep -q jlfbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      jlfbot:
        condition: service_healthy
    environment:
      JLFBOT_HTTP_PORT: ${JLFBOT_HTTP_PORT:-8080}
      JLFBOT_PORT: ${JLFBOT_PORT:-8799}
      JLFBOT_WEBHOOK_PORT: ${JLFBOT_WEBHOOK_PORT:-8800}
      JLFBOT_HTTPS_HOST: ${JLFBOT_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
